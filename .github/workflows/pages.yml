name: Build firmware and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the JieLi build tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-ac79-v1.2.1-linux-x64

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow fonttools
          if [ ! -x "$HOME/.jieli/toolchain/pi32v2/bin/clang" ]; then
            rm -rf "$HOME/.jieli"
            tools/get_toolchain.sh "$HOME/.jieli"
          fi
          if [ ! -f "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot" ]; then
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git \
              "$HOME/fw-AC79_AIoT_SDK"
          fi

      - name: Build Felucca-RDX firmware
        shell: bash
        env:
          FELUCCA_RDX: "1"
          FELUCCA_FM6_ONLY: "1"
          FELUCCA_CPU2: "1"
          JIELI_DOCKER: "0"
        run: |
          set -euo pipefail
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain"
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          ./build.sh

      - name: Assemble the Pages site
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define RDX_VERSION "\([^"]*\)"$/\1/p' firmware/src/rdx_version.h)"
          test -n "$version"
          python web/make_site.py \
            build/felucca.fwsc "rdx-$version" build/site build/felucca-clean.fwsc
          touch build/site/.nojekyll
          test -s build/site/webapp/installer/index.html
          test -s build/site/webapp/editor/index.html
          test -s "build/site/firmware/felucca-rdx-$version.fwsc"
          grep -q "Felucca-RDX Installer" build/site/webapp/installer/index.html
          grep -q "Felucca-RDX Editor" build/site/webapp/editor/index.html

      - name: Test the web tools
        shell: bash
        run: |
          set -euo pipefail
          node web/test_backup.mjs
          node web/test_web.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
