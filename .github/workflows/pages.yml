name: Build firmware and deploy Pages

on:
  push:
    branches: [main, codex/rdx-editor]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the JieLi toolchain
        uses: actions/cache@v5
        with:
          path: ~/.jieli
          key: jieli-linux-toolchain-20260730.1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow fonttools
          if [ ! -x "$HOME/.jieli/toolchain/pi32v2/bin/clang" ]; then
            rm -rf "$HOME/.jieli"
            tools/get_toolchain.sh "$HOME/.jieli"
          fi
          sdk_tools="$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools"
          rm -rf "$HOME/fw-AC79_AIoT_SDK"
          mkdir -p "$sdk_tools/cfg"
          sdk_url="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK/raw/AC79NN_SDK_V1.2.1_2023-12-13/cpu/wl82/tools"
          curl -fL --retry 3 "$sdk_url/uboot.boot" -o "$sdk_tools/uboot.boot"
          curl -fL --retry 3 "$sdk_url/cfg_tool.bin" -o "$sdk_tools/cfg_tool.bin"
          curl -fL --retry 3 "$sdk_url/cfg/eq_cfg_hw.bin" -o "$sdk_tools/cfg/eq_cfg_hw.bin"
          echo "4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4  $sdk_tools/uboot.boot" | sha256sum --check --strict
          echo "276579954f076886a6a7694f65dc71c034a63a2c204b76749065c0ac7b010d1b  $sdk_tools/cfg_tool.bin" | sha256sum --check --strict
          echo "41167491bffed4651750719c973d2758adeb9021a5670d02d6a53c85ed80ea7d  $sdk_tools/cfg/eq_cfg_hw.bin" | sha256sum --check --strict

      - name: Build Felucca-RDX firmware
        shell: bash
        env:
          FELUCCA_RDX: "1"
          FELUCCA_FM6_ONLY: "1"
          FELUCCA_CPU2: "1"
          JIELI_DOCKER: "0"
        run: |
          set -euo pipefail
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain"
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          ./build.sh

      - name: Assemble the Pages site
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define RDX_VERSION "\([^"]*\)"$/\1/p' firmware/src/rdx_version.h)"
          test -n "$version"
          python web/make_site.py \
            build/felucca.fwsc "rdx-$version" build/site build/felucca-clean.fwsc
          touch build/site/.nojekyll
          test -s build/site/webapp/installer/index.html
          test -s build/site/webapp/editor/index.html
          test -s "build/site/firmware/felucca-rdx-$version.fwsc"
          grep -q "Felucca-RDX Installer" build/site/webapp/installer/index.html
          grep -q "Felucca-RDX Editor" build/site/webapp/editor/index.html

      - name: Test the web tools
        shell: bash
        run: |
          set -euo pipefail
          node web/test_backup.mjs
          node web/test_web.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
